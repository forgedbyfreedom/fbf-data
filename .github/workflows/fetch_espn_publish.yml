name: Auto Fetch & Publish ESPN Odds

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # every 6 hours (11pm / 5am / 11am / 5pm ET)
  workflow_dispatch:

concurrency:
  group: fbf-data-write   # both workflows write the same files
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      #####################################################################
      # 1) CLEAN WORKSPACE
      #####################################################################
      - name: Clean workspace
        run: |
          echo "Cleaning workspace..."
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          echo "Workspace cleaned."

      #####################################################################
      # 2) CHECKOUT
      #####################################################################
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      #####################################################################
      # 3) SET UP PYTHON 3.12
      #####################################################################
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      #####################################################################
      # 4) INSTALL REQUIREMENTS
      #####################################################################
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #####################################################################
      # 5) SAVE COMPLETED SCORES (before ESPN refresh overwrites them)
      #####################################################################
      - name: Save completed scores
        run: python3 save_completed_scores.py || echo "Score save skipped"

      #####################################################################
      # 6) FETCH ESPN DATA
      #####################################################################
      - name: Fetch ESPN odds
        run: python3 fetch_espn_all.py

      #####################################################################
      # 6) TAG FAVORITES
      #####################################################################
      - name: Tag favorites
        run: python3 tag_favorites.py
      #####################################################################
      # 7) BUILD STADIUM FILES
      #####################################################################
      - name: Build FBS Stadiums
        run: |
          python3 build_fbs_stadiums.py
          echo "Stadium files built."

      #####################################################################
      # 7b) ENRICH VENUES WITH COORDINATES (from stadiums_master.json)
      #####################################################################
      - name: Enrich venue coordinates
        run: python3 build_venues_from_combined.py || echo "Venue enrichment skipped"

      #####################################################################
      # 8) WEATHER PIPELINE
      #####################################################################
      - name: Fetch Weather
        run: python3 fetch_weather.py

      - name: Compute Weather Risk
        run: python3 weather_risk1.py

      - name: Merge Weather
        run: python3 merge_weather.py

      #####################################################################
      # 9) INJURY PIPELINE
      #####################################################################
      - name: Fetch Injuries (non-fatal)
        run: python3 fetch_injuries.py || echo "Injury fetch failed -- continuing"

      - name: Merge Injuries (non-fatal)
        run: python3 merge_injuries.py || echo "Merge injuries failed -- continuing"

      #####################################################################
      # 10) ADVANCED FEATURES
      #####################################################################
      - name: Build rest days
        run: python3 build_rest_days.py || echo "Rest days skipped"

      - name: Build Elo ratings
        run: python3 build_elo.py || echo "Elo ratings skipped"

      - name: Build H2H matchup data
        run: python3 build_h2h.py || echo "H2H data skipped"

      - name: Fetch referee assignments (external sources)
        run: python3 fetch_referees.py || echo "Referee fetch skipped"

      - name: Build referee trends
        run: python3 build_ref_trends.py || echo "Ref trends skipped"

      - name: Build power ratings
        run: python3 build_power_ratings.py || echo "Power ratings skipped"

      - name: Build situational spots
        run: python3 build_situational.py || echo "Situational spots skipped"
      - name: Scrape public betting consensus
        run: python3 scrape_public_betting.py || echo "Public betting skipped"

      - name: Track line movement
        run: python3 track_line_movement.py || echo "Line movement skipped"

      - name: Merge all features onto games
        run: python3 merge_features.py || echo "Feature merge skipped"

      #####################################################################
      # 11) HISTORICAL DATA + ML
      #####################################################################
      - name: Build historical results (incremental, fallback)
        run: timeout 600 python3 build_historical_results.py || echo "Historical results skipped/timed out (runs nightly via build_historical.yml)"
      #####################################################################
      # 12) PREDICTIONS
      #####################################################################
      - name: Build predictions
        run: python3 build_predictions.py

      #####################################################################
      # 13) ACCURACY TRACKING
      #####################################################################
      - name: Track accuracy
        run: python3 track_accuracy.py || echo "Accuracy tracking skipped"

      #####################################################################
      # 14) HEALTH CHECK
      #####################################################################
      - name: Validate predictions
        run: |
          python3 -c "
          import json, sys
          with open('predictions.json') as f:
              data = json.load(f)
          count = data.get('count', 0)
          preds = data.get('predictions', [])
          sports = set(p.get('sport','') for p in preds)
          print(f'Predictions: {count} games across {len(sports)} sports: {sorted(sports)}')
          if count == 0:
              print('WARNING: 0 predictions generated')
              sys.exit(1)
          print('Health check passed')
          "

      #####################################################################
      # 15) PUSH BACK UPDATED DATA
      #####################################################################
      - name: Commit & Push updated data
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto update data $(date -u +"%Y-%m-%d %H:%M:%S") UTC"

          # Push with bounded retries. This step used to end in
          #   git pull --rebase --autostash || true
          #   git push || echo "Nothing to push"
          # which made it impossible to fail: on 2026-09-02 the rebase hit a
          # conflict in historical_results.json against a concurrent nightly
          # run, `|| true` swallowed it, the repo was left mid-rebase and
          # detached, `git push` died with "You are not currently on a branch",
          # and `|| echo` swallowed that too. The workflow reported success and
          # silently published nothing. Failures are now loud.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto origin/main."
            git fetch origin main
            # These files are fully regenerated by this run, so on a collision
            # this run's freshly built output is the correct side to keep.
            if ! git rebase origin/main; then
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done

          echo "::error::Could not push after 3 attempts."
          exit 1
      #####################################################################
      # 16) DONE
      #####################################################################
      - name: Cleanup
        run: echo "Done."
