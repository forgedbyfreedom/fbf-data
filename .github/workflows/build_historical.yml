name: Nightly Historical Data Build

on:
  schedule:
    - cron: "0 4 * * *"  # 4 AM UTC daily
  workflow_dispatch:

concurrency:
  group: fbf-data-write   # both workflows write the same files
  cancel-in-progress: false

jobs:
  build-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build historical results
        run: python3 build_historical_results.py

      - name: Scrape NFL referee penalties
        run: python3 scrape_nfl_penalties.py || echo "NFL penalty scrape skipped"
      - name: Build referee trends from historical data
        run: python3 build_ref_trends.py

      - name: Validate historical data
        run: |
          python3 -c "
          import json, sys, os
          with open('historical_results.json') as f:
              data = json.load(f)
          count = data.get('count', 0)
          print(f'Historical records: {count}')
          if count == 0:
              print('WARNING: 0 historical records')
              sys.exit(1)
          with open('referee_trends.json') as f:
              refs = json.load(f)
          ref_count = len(refs.get('refs', {}))
          print(f'Referee trends: {ref_count} refs')
          for f_name in ['nfl_ref_penalties.json']:
              if os.path.exists(f_name):
                  with open(f_name) as f:
                      d = json.load(f)
                  k = 'refs' if 'refs' in d else 'umps'
                  print(f'{f_name}: {len(d.get(k, {}))} entries')
              else:
                  print(f'{f_name}: not found (scraper may have failed)')
          print('Historical build passed')
          "

      - name: Commit & Push updated data
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Nightly historical data update $(date -u +"%Y-%m-%d")"

          # Push with bounded retries. This step used to end in
          #   git pull --rebase --autostash || true
          #   git push || echo "Nothing to push"
          # which made it impossible to fail: on 2026-09-02 the rebase hit a
          # conflict in historical_results.json against a concurrent nightly
          # run, `|| true` swallowed it, the repo was left mid-rebase and
          # detached, `git push` died with "You are not currently on a branch",
          # and `|| echo` swallowed that too. The workflow reported success and
          # silently published nothing. Failures are now loud.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto origin/main."
            git fetch origin main
            # These files are fully regenerated by this run, so on a collision
            # this run's freshly built output is the correct side to keep.
            if ! git rebase origin/main; then
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done

          echo "::error::Could not push after 3 attempts."
          exit 1
